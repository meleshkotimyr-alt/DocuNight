
name: Build DocuNight for Windows

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build DocuNight
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name DocuNight --collect-all PySide6 --collect-all docx main.py

      - name: Package app
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/DocuNight/*" -DestinationPath "DocuNight-Windows-x64.zip" -Force

      - name: Upload ready app
        uses: actions/upload-artifact@v4
        with:
          name: DocuNight-Windows-x64
          path: DocuNight-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
